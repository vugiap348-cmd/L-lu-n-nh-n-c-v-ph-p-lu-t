<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rung Chuông Vàng Quốc Hội</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#D21F1F;
    --red-deep:#5C0B0B;
    --red-bright:#FF3B30;
    --maroon:#3A0808;
    --maroon-deep:#220303;
    --gold:#E8BE5E;
    --gold-light:#FCE7AE;
    --gold-deep:#9C7222;
    --cream:#F7E9C6;
    --ink:#FBEFD6;
    --ink-soft:#D8B98A;
    --card:#40090A;
    --green:#3FA86A;
    --line: rgba(232,190,94,0.35);
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Be Vietnam Pro', 'Segoe UI', sans-serif;
    background:
      radial-gradient(ellipse 60% 45% at 50% 30%, rgba(0,0,0,0.35), transparent 70%),
      radial-gradient(circle at 8% 6%, rgba(255,140,120,0.35), transparent 30%),
      radial-gradient(circle at 92% 12%, rgba(255,100,90,0.28), transparent 32%),
      radial-gradient(circle at 5% 95%, rgba(80,0,0,0.55), transparent 40%),
      radial-gradient(circle at 95% 92%, rgba(80,0,0,0.55), transparent 40%),
      linear-gradient(160deg, #E4392C 0%, #B4160F 22%, #8A0E0B 45%, #6E0A08 65%, #4A0605 85%, #2B0302 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    overflow-x:hidden;
    position:relative;
  }

  /* faint star field backdrop */
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
  }
  .stars span{
    position:absolute; color:var(--gold-light); font-size:14px;
    animation: drift 14s linear infinite;
    opacity:0.5;
  }
  @keyframes drift{
    0%{ transform:translateY(0) rotate(0deg); opacity:0.15;}
    50%{ opacity:0.5;}
    100%{ transform:translateY(-40px) rotate(25deg); opacity:0.15;}
  }

  .emblem{
    position:fixed;
    top:50%; left:50%;
    width:min(78vw, 620px); height:min(78vw, 620px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:0; pointer-events:none;
    opacity:0.16;
    background:
      repeating-radial-gradient(circle, transparent 0 18px, rgba(232,190,94,0.5) 18px 19px, transparent 19px 40px),
      radial-gradient(circle, rgba(232,190,94,0.25), transparent 70%);
    border:1px solid rgba(232,190,94,0.4);
  }
  .emblem::before{
    content:"";
    position:absolute; inset:14%;
    border-radius:50%;
    border:1px dashed rgba(232,190,94,0.5);
  }
  .emblem::after{
    content:"★";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:64px; color:rgba(232,190,94,0.35);
  }

  .stage{
    position:relative; z-index:1;
    width:100%; max-width:640px;
  }
  .stage::before{
    content:"";
    position:absolute;
    top:-60px; left:50%;
    width:120%; height:460px;
    transform:translateX(-50%);
    background: radial-gradient(ellipse 50% 60% at 50% 0%, rgba(255,214,140,0.35), rgba(255,214,140,0.08) 45%, transparent 75%);
    filter: blur(6px);
    pointer-events:none;
    z-index:-1;
  }

  /* Header ribbon */
  .masthead{
    text-align:center;
    margin-bottom:18px;
    animation: settle .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes settle{
    from{ opacity:0; transform:translateY(-14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .masthead .badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:56px; height:56px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, var(--gold-deep) 100%);
    box-shadow: 0 4px 18px rgba(0,0,0,0.45), inset 0 0 0 3px rgba(92,11,11,0.6);
    font-size:26px;
    margin-bottom:12px;
    color:var(--maroon-deep);
  }
  .masthead h1{
    font-size:clamp(22px, 5.5vw, 30px);
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    line-height:1.2;
    color:var(--gold-light);
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .masthead p{
    margin:0; color:var(--ink-soft); font-size:14.5px; font-weight:500;
  }

  /* Progress ribbon */
  .progress-wrap{
    display:flex; align-items:center; gap:10px;
    margin-bottom:16px;
  }
  .progress-track{
    flex:1; height:10px; border-radius:999px;
    background:rgba(0,0,0,0.35);
    border:1px solid var(--line);
    overflow:hidden;
    position:relative;
  }
  .progress-fill{
    height:100%; border-radius:999px;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-light));
    width:0%;
    transition: width .5s cubic-bezier(.2,.8,.2,1);
  }
  .progress-count{
    font-weight:700; font-size:13.5px; color:var(--ink-soft);
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  .score-pill{
    display:flex; align-items:center; gap:6px;
    background:linear-gradient(160deg, #5C0F0F, #340707);
    border:1.5px solid var(--line);
    border-radius:999px; padding:6px 14px; font-weight:700; font-size:13.5px;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
    color:var(--gold-light);
  }

  /* Card */
  .card{
    background:
      linear-gradient(155deg, rgba(255,255,255,0.04), transparent 40%),
      linear-gradient(200deg, #4A0B0B 0%, #2E0505 55%, #1E0303 100%);
    border-radius:16px;
    border:1.5px solid var(--gold-deep);
    box-shadow:
      0 30px 60px rgba(0,0,0,0.6),
      0 10px 24px rgba(0,0,0,0.5),
      0 0 60px rgba(232,190,94,0.12),
      inset 0 0 0 1px rgba(232,190,94,0.25),
      inset 0 1px 0 rgba(255,255,255,0.08);
    padding:28px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:5px;
    background: linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold-light) 50%, var(--gold) 85%, transparent);
  }
  .card::after{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(232,190,94,0.22);
    border-radius:11px;
    pointer-events:none;
  }

  .qnum{
    display:inline-flex; align-items:center; gap:8px;
    color:var(--gold); font-weight:800; font-size:13px;
    letter-spacing:0.04em;
    margin-bottom:10px;
  }
  .qnum .star{ color:var(--gold-light); font-size:15px; }

  .question{
    font-size:clamp(18px, 4.6vw, 21px);
    font-weight:700;
    line-height:1.4;
    margin:0 0 20px;
    color:var(--ink);
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }

  .options{
    display:grid; grid-template-columns:1fr; gap:12px;
  }
  .opt{
    display:flex; align-items:center; gap:12px;
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1.6px solid rgba(232,190,94,0.3);
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(0,0,0,0.15)), #57100F;
    color:var(--ink);
    font-family:inherit; font-size:15px; font-weight:600;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  .opt:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    border-color: var(--gold-light);
  }
  .opt:active:not(:disabled){ transform:translateY(0); }
  .opt:disabled{ cursor:default; }
  .opt .letter{
    flex:0 0 auto;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold-deep));
    border:1px solid rgba(0,0,0,0.25);
    color:var(--maroon-deep); font-weight:800; font-size:13.5px;
  }
  .opt.correct{
    background: linear-gradient(160deg, rgba(63,168,106,0.25), rgba(63,168,106,0.08));
    border-color:var(--green);
    animation: pop .35s ease;
  }
  .opt.correct .letter{ background:var(--green); border-color:var(--green); color:#fff; }
  .opt.wrong{
    background: linear-gradient(160deg, rgba(255,59,48,0.28), rgba(255,59,48,0.1));
    border-color:var(--red-bright);
    animation: shake .4s ease;
  }
  .opt.wrong .letter{ background:var(--red-bright); border-color:var(--red-bright); color:#fff; }
  .opt.dim{ opacity:0.45; }

  @keyframes pop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.03); }
    100%{ transform:scale(1); }
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }

  .feedback{
    margin-top:16px;
    min-height:22px;
    font-weight:700; font-size:14.5px;
    display:flex; align-items:center; gap:8px;
    opacity:0; transform:translateY(6px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .feedback.show{ opacity:1; transform:translateY(0); }
  .feedback.ok{ color:#7EE3A8; }
  .feedback.bad{ color:#FF9187; }

  .next-btn{
    margin-top:18px;
    width:100%;
    padding:14px;
    border:1px solid var(--gold-deep);
    border-radius:12px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-deep));
    color:var(--maroon-deep);
    font-family:inherit; font-weight:800; font-size:15px;
    letter-spacing:0.02em;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
    opacity:0; transform:translateY(8px);
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease, box-shadow .15s ease;
  }
  .next-btn.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .next-btn:hover{ box-shadow:0 10px 26px rgba(0,0,0,0.5); }
  .next-btn:active{ transform:translateY(1px); }

  /* Result screen */
  .result{
    text-align:center;
    padding:12px 4px 4px;
  }
  .result .medal{
    width:86px; height:86px; margin:0 auto 14px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, var(--gold-deep) 100%);
    box-shadow: 0 8px 26px rgba(0,0,0,0.5), inset 0 0 0 4px rgba(92,11,11,0.6);
    animation: medalIn .55s cubic-bezier(.2,.9,.25,1.2) both;
  }
  @keyframes medalIn{
    from{ transform:scale(0) rotate(-30deg); opacity:0; }
    to{ transform:scale(1) rotate(0); opacity:1; }
  }
  .result h2{ font-size:24px; margin:0 0 6px; font-weight:800; color:var(--gold-light); }
  .result .rank{
    display:inline-block;
    background: rgba(232,190,94,0.12);
    color:var(--gold-light);
    border:1.5px solid rgba(232,190,94,0.4);
    padding:6px 16px; border-radius:999px;
    font-weight:800; font-size:14px; margin-bottom:14px;
  }
  .result .scoreline{
    font-size:15px; color:var(--ink-soft); margin-bottom:20px;
  }
  .result .scoreline b{ color:var(--ink); font-size:22px; }
  .retry-btn{
    padding:13px 26px;
    border:2px solid var(--gold);
    background:transparent;
    color:var(--gold-light);
    font-family:inherit; font-weight:800; font-size:14.5px;
    border-radius:999px; cursor:pointer;
    transition: background .15s ease, color .15s ease, transform .15s ease;
  }
  .retry-btn:hover{ background:var(--gold); color:var(--maroon-deep); transform:translateY(-2px); }

  .thanks{
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid rgba(232,190,94,0.25);
    font-size:clamp(19px, 5.5vw, 25px);
    font-weight:800;
    line-height:1.35;
    color:var(--gold-light);
    text-shadow: 0 2px 14px rgba(232,190,94,0.35), 0 2px 6px rgba(0,0,0,0.5);
    animation: thanksIn .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes thanksIn{
    from{ opacity:0; transform:translateY(10px) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  footer{
    text-align:center; margin-top:16px; font-size:12px; color:var(--ink-soft);
    opacity:0.75;
  }

  /* confetti */
  .confetti-piece{
    position:fixed; top:-20px; z-index:50; border-radius:2px;
    pointer-events:none;
    animation-name: fall; animation-timing-function: cubic-bezier(.2,.6,.4,1); animation-fill-mode: forwards;
  }
  @keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(105vh) rotate(540deg); opacity:0.9; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="emblem"></div>

<div class="stage">
  <div class="masthead">
    <div class="badge">★</div>
    <h1>Rung Chuông Vàng Quốc Hội</h1>
    <p>Tìm hiểu bộ máy Nhà nước CHXHCN Việt Nam</p>
  </div>

  <div class="progress-wrap">
    <div class="score-pill" id="scorePill">★ 0/10</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-count" id="progressCount">Câu 1/10</div>
  </div>

  <div class="card" id="card">
    <!-- quiz content injected here -->
  </div>

  <footer>Đáp án dựa trên nội dung câu hỏi đã cung cấp • Chạm để chọn</footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "Cơ quan nào là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước CHXHCN Việt Nam?",
    opts: ["Chính phủ", "Quốc hội", "Tòa án nhân dân tối cao", "Chủ tịch nước"],
    correct: 1
  },
  {
    q: "Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước CHXHCN Việt Nam thực hiện nhiệm vụ nào?",
    opts: ["Lập pháp và hành pháp", "Tư pháp và xét xử", "Đối nội và đối ngoại", "Quản lý kinh tế xã hội"],
    correct: 2
  },
  {
    q: "Cơ quan nào là cơ quan xét xử của nước CHXHCN Việt Nam, thực hiện quyền tư pháp?",
    opts: ["Viện kiểm sát nhân dân", "Tòa án nhân dân", "Bộ Công an", "Ủy ban Tư pháp của Quốc hội"],
    correct: 1
  },
  {
    q: "Nguyên tắc nào sau đây là bắt buộc khi Thẩm phán và Hội thẩm xét xử vụ án?",
    opts: ["Tuân theo chỉ thị của Tòa án cấp trên", "Độc lập và chỉ tuân theo pháp luật", "Lắng nghe ý kiến của cơ quan hành chính", "Phải có sự đồng ý của Viện kiểm sát"],
    correct: 1
  },
  {
    q: "Viện kiểm sát nhân dân thực hiện hai chức năng cốt lõi nào sau đây?",
    opts: ["Điều tra tội phạm và Xét xử vụ án", "Thực hành quyền công tố và Kiểm sát hoạt động tư pháp", "Ban hành luật và Giám sát tối cao", "Quản lý hành chính và Giải quyết khiếu nại"],
    correct: 1
  },
  {
    q: "Cơ quan nào sau đây do Quốc hội thành lập, có nhiệm vụ tổ chức bầu cử đại biểu Quốc hội?",
    opts: ["Kiểm toán nhà nước", "Hội đồng bầu cử quốc gia", "Văn phòng Chính phủ", "Ủy ban Thường vụ Quốc hội"],
    correct: 1
  },
  {
    q: "Cơ quan nào là cơ quan thường trực của Quốc hội, thực hiện nhiệm vụ điều hành công tác của Quốc hội giữa hai kỳ họp?",
    opts: ["Ủy ban Thường vụ Quốc hội", "Văn phòng Quốc hội", "Hội đồng Dân tộc của Quốc hội", "Chính phủ"],
    correct: 0
  },
  {
    q: "Hệ thống Tòa án nhân dân ở nước ta hiện nay KHÔNG bao gồm cấp nào sau đây?",
    opts: ["Tòa án nhân dân tối cao", "Tòa án nhân dân cấp cao", "Tòa án nhân dân cấp tỉnh, cấp huyện", "Tòa án nhân dân cấp xã"],
    correct: 3
  },
  {
    q: "Cơ quan nào là cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương?",
    opts: ["Ủy ban nhân dân (UBND)", "Văn phòng Tỉnh ủy", "Tòa án nhân dân địa phương", "Đoàn đại biểu Quốc hội địa phương"],
    correct: 0
  },
  {
    q: "Đại biểu Quốc hội và đại biểu Hội đồng nhân dân bị cử tri hoặc Quốc hội, Hội đồng nhân dân bãi nhiệm khi nào?",
    opts: ["Khi không còn xứng đáng với sự tín nhiệm của Nhân dân", "Khi vắng mặt quá 2 kỳ họp liên tiếp có lý do", "Khi thay đổi nơi cư trú sang địa phương khác", "Khi hết nhiệm kỳ 5 năm làm việc"],
    correct: 0
  }
];

const LETTERS = ["A","B","C","D"];
let current = 0;
let score = 0;
let locked = false;

const card = document.getElementById("card");
const progressFill = document.getElementById("progressFill");
const progressCount = document.getElementById("progressCount");
const scorePill = document.getElementById("scorePill");

function renderStars(){
  const wrap = document.getElementById("stars");
  const glyphs = ["★","☆"];
  for(let i=0;i<16;i++){
    const s = document.createElement("span");
    s.textContent = glyphs[i % 2];
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    s.style.fontSize = (10 + Math.random()*14) + "px";
    s.style.animationDuration = (10 + Math.random()*10) + "s";
    s.style.animationDelay = (Math.random()*8) + "s";
    wrap.appendChild(s);
  }
}
renderStars();

function updateProgress(){
  progressFill.style.width = (current/QUESTIONS.length*100) + "%";
  progressCount.textContent = `Câu ${Math.min(current+1, QUESTIONS.length)}/${QUESTIONS.length}`;
  scorePill.innerHTML = `★ ${score}/${QUESTIONS.length}`;
}

function renderQuestion(){
  locked = false;
  updateProgress();
  const item = QUESTIONS[current];
  card.innerHTML = `
    <div class="qnum"><span class="star">★</span>CÂU HỎI ${current+1} / ${QUESTIONS.length}</div>
    <p class="question">${item.q}</p>
    <div class="options" id="options">
      ${item.opts.map((o,i)=>`
        <button class="opt" data-idx="${i}">
          <span class="letter">${LETTERS[i]}</span>
          <span>${o}</span>
        </button>
      `).join("")}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">${current === QUESTIONS.length-1 ? "Xem kết quả" : "Câu tiếp theo"}</button>
  `;
  card.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>handleAnswer(parseInt(btn.dataset.idx)));
  });
  document.getElementById("nextBtn").addEventListener("click", nextQuestion);
}

function handleAnswer(idx){
  if(locked) return;
  locked = true;
  const item = QUESTIONS[current];
  const buttons = card.querySelectorAll(".opt");
  const feedback = document.getElementById("feedback");
  const nextBtn = document.getElementById("nextBtn");

  buttons.forEach((b,i)=>{
    b.disabled = true;
    if(i === item.correct){ b.classList.add("correct"); }
    else if(i === idx){ b.classList.add("wrong"); }
    else { b.classList.add("dim"); }
  });

  if(idx === item.correct){
    score++;
    feedback.textContent = "★ Chính xác! Đúng tinh thần đại biểu.";
    feedback.className = "feedback ok show";
    burstConfetti();
  } else {
    feedback.textContent = `✕ Chưa đúng. Đáp án là ${LETTERS[item.correct]}.`;
    feedback.className = "feedback bad show";
  }
  updateProgress();
  nextBtn.classList.add("show");
}

function nextQuestion(){
  current++;
  if(current >= QUESTIONS.length){
    renderResult();
  } else {
    renderQuestion();
  }
}

function rankFor(score){
  if(score === 10) return { title:"Đại biểu Quốc hội danh dự", medal:"🏆" };
  if(score >= 8) return { title:"Cử tri xuất sắc", medal:"🥇" };
  if(score >= 6) return { title:"Cử tri am hiểu", medal:"🥈" };
  if(score >= 4) return { title:"Cử tri chăm chỉ", medal:"🥉" };
  return { title:"Cần ôn lại bài", medal:"📖" };
}

function renderResult(){
  const r = rankFor(score);
  progressFill.style.width = "100%";
  progressCount.textContent = `Hoàn thành`;
  scorePill.innerHTML = `★ ${score}/${QUESTIONS.length}`;
  card.innerHTML = `
    <div class="result">
      <div class="medal">${r.medal}</div>
      <h2>Hoàn thành bài thi!</h2>
      <div class="rank">${r.title}</div>
      <div class="scoreline">Điểm số của bạn: <b>${score}/${QUESTIONS.length}</b></div>
      <button class="retry-btn" id="retryBtn">Làm lại từ đầu</button>
      <div class="thanks">Cảm ơn đã theo dõi bài thuyết trình của nhóm chúng em ❤️</div>
    </div>
  `;
  document.getElementById("retryBtn").addEventListener("click", ()=>{
    current = 0; score = 0;
    renderQuestion();
  });
  if(score >= 6){ burstConfetti(28); }
}

function burstConfetti(n){
  const colors = ["#E8BE5E","#FCE7AE","#FF3B30","#3FA86A"];
  const count = n || 14;
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    const size = 6 + Math.random()*6;
    el.className = "confetti-piece";
    el.style.left = (10 + Math.random()*80) + "vw";
    el.style.width = size + "px";
    el.style.height = (size*0.4) + "px";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.6 + Math.random()*1.2) + "s";
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 3200);
  }
}

renderQuestion();
</script>
